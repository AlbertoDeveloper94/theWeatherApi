<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Weather Api</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body
    class="bg-gradient-to-b from-[#0F1921] via-[#1A2633] to-[#0F1921] min-h-screen"
  >
    <div class="text-white w-[90%] mx-auto">
      <header
        id="weatherMenu"
        class="flex justify-between items-center p-8 border-b-2 border-white/30"
      >
        <a href="" class="w-1/5 h-100">
          <i class="fa-solid fa-location-dot text-blue-600 text-3xl"></i>
        </a>

        <input type="text" class="w-2/5" placeholder="Escribe una ciudad" />

        <h1 class="w-2/5 text-end text-3xl font-[400]"></h1>
      </header>
      <main></main>
      <footer></footer>
    </div>

    <script src="https://cdn.tailwindcss.com"></script>
  </body>
</html>
